name: Arvados Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  workbench2:
    name: Workbench2 Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-tags: true # Needed for go VCS stamping to succeed
      - name: Fetch tags
        run: |
          git fetch --tags origin
          echo $(git describe --long)

      # Temporarily after checkout
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # true = remove
          # false = keep
          # this might remove tools that are actually needed, (Node, Go, Python, Ruby, ...)
          # if set to "true" but frees about 6 GB
          tool-cache: false
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          # Cleaning up images causes some failure with the docker build/tests
          docker-images: false
          # Keep swap to avoid thrashing unless we really need the space
          swap-storage: false
      - name: Install pipx and dependencies
        run: |
          sudo apt update
          sudo apt install -y pipx xvfb
      # - name: Fix HOME Directory
      #   shell: bash
      #   run: |
      #     # Issue [HOME is overridden for containers](https://github.com/actions/runner/issues/863)
      #     h=$(getent passwd $(id -un) | cut -d: -f6)
      #     if [ "$h" = "$HOME" ]; then
      #       echo "HOME fine: $HOME"
      #       exit 0
      #     fi
      #     echo "HOME=$HOME was broken. Setting it to $h"
      #     ls -ld $HOME
      #     ls -ld $h
      #     echo "USER: $USER"
      #     echo "id: $(id)"
      #     echo "HOME=$h" >> $GITHUB_ENV
      - name: Fix actions/checkout quirks
        run: |
          git tag
        # git remote set-head origin --auto
        # git fetch --tags origin
        # git fetch --tags --force
        # git branch
      - name: Install Ansible
        run: tools/ansible/install-ansible.sh
      - name: Run tests with Docker image
        run: echo "$(whoami)" && echo $PWD && echo "$(id)" && cd services/workbench2 && make tests-in-docker
